[package]
name = "probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Same crate versions and features as kiwix-workbench: copy src-tauri/Cargo.lock
# here before building (see ../README.md).
[dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rustls-platform-verifier = "0.7.1"
jni_0_22 = { package = "jni", version = "0.22.4" }
ndk-context = "0.1.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
