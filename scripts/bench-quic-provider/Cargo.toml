[package]
name = "kiwix-quic-wire-probe"
version = "0.1.0"
edition = "2024"

[features]
reference = ["quinn/rustls-ring", "rustls/ring", "dep:ring"]
candidate = ["quinn-proto/rustls-no-provider", "dep:oxiquic-crypto", "dep:aes-gcm",
             "dep:getrandom", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:zeroize"]

[dependencies]
anyhow = "1"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio"] }
quinn-proto = { version = "=0.11.19", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
oxiquic-crypto = { version = "=0.2.1", optional = true }
ring = { version = "=0.17.14", optional = true }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"], optional = true }
getrandom = { version = "=0.4.3", optional = true }
hkdf = { version = "=0.13.0", optional = true }
hmac = { version = "=0.13.0", optional = true, features = ["zeroize"] }
sha2 = { version = "=0.11.1", optional = true }
zeroize = { version = "1", optional = true }

[patch.crates-io]
quinn-proto = { path = "vendor/quinn-proto-0.11.19" }
oxiquic-crypto = { path = "vendor/oxiquic-crypto-0.2.1" }
