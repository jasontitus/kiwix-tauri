name: KiwixPhoneWindowUI
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  KiwixPhoneWindowUI:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhoneWindowUI.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiltastech.kiwix.phonewindow
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
schemes:
  KiwixPhoneWindowUI:
    build:
      targets:
        KiwixPhoneWindowUI: [test]
    test:
      targets:
        - KiwixPhoneWindowUI
      gatherCoverageData: false
      parallelizable: false
