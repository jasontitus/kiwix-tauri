[package]
name = "kiwix-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
zimru = { git = "https://github.com/jasontitus/zimru.git", rev = "cbafcb41da64c390c7889b122c677f23bcde8dc5", default-features = false }

[patch.crates-io]
itoa = { path = "../vendor/itoa-1.0.19" }
memchr = { path = "../vendor/memchr-2.8.3" }
serde_json = { path = "../vendor/serde_json-1.0.154" }
zmij = { path = "../vendor/zmij-1.0.23" }

[workspace]

[[bin]]
name = "zim_archive"
path = "fuzz_targets/zim_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_protocol"
path = "fuzz_targets/mcp_protocol.rs"
test = false
doc = false
bench = false
