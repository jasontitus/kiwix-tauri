[package]
edition = "2021"
rust-version = "1.61"
name = "memchr"
version = "2.8.3"
authors = [
    "Andrew Gallant <jamslam@gmail.com>",
    "bluss",
]
build = false
exclude = [
    "/.github",
    "/benchmarks",
    "/fuzz",
    "/scripts",
    "/tmp",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Checked byte and substring search for Kiwix"
homepage = "https://github.com/BurntSushi/memchr"
documentation = "https://docs.rs/memchr/"
readme = "README.md"
keywords = [
    "memchr",
    "memmem",
    "substring",
    "find",
    "search",
]
license = "Unlicense OR MIT"
repository = "https://github.com/BurntSushi/memchr"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[features]
alloc = []
default = ["std"]
libc = []
logging = []
rustc-dep-of-std = ["core"]
std = ["alloc"]
use_std = ["std"]

[lib]
name = "memchr"
path = "src/lib.rs"
bench = false

[dependencies.core]
version = "1.0.0"
optional = true
package = "rustc-std-workspace-core"

[dev-dependencies.quickcheck]
version = "1.0.3"
default-features = false

[profile.bench]
debug = 2

[profile.release]
debug = 2

[profile.test]
opt-level = 3
debug = 2
