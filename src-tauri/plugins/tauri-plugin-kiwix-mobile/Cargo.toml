[package]
name = "tauri-plugin-kiwix-mobile"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
links = "tauri-plugin-kiwix-mobile"

[dependencies]
tauri = { version = "2.12", default-features = false }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tokio = { version = "1", features = ["sync", "macros"] }

[build-dependencies]
tauri-plugin = { version = "2.7.1", features = ["build"] }
