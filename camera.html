<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiwix — Camera</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1c1c1a; --muted: #5c5c57; --accent: #2557a7; --panel: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecece8; --muted: #a8a8a0; --accent: #8fb4ff; --panel: #222220; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
      main { height: 100%; display: grid; grid-template-rows: 1fr auto; }
      .stage { position: relative; display: grid; place-items: center; background: #000; overflow: hidden; }
      video { max-width: 100%; max-height: 100%; }
      video.mirror { transform: scaleX(-1); }
      .message { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #f0f0ea; }
      .controls { display: flex; gap: 10px; justify-content: center; align-items: center; padding: 14px; background: var(--panel); }
      button { font: inherit; padding: 9px 18px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent); background: transparent; color: var(--fg); cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: default; }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="stage">
        <video id="preview" autoplay playsinline muted aria-label="Camera preview"></video>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </div>
      <div class="controls">
        <button id="cancel" type="button">Cancel</button>
        <button id="switch" type="button" hidden>Switch camera</button>
        <button id="take" type="button" class="primary" disabled>Take photo</button>
      </div>
    </main>
    <script type="module" src="/src/camera.ts"></script>
  </body>
</html>
