name: Checks

# Frontend and policy checks run here alongside cross-target Rust clippy and
# the Linux Rust unit tests. This is the only workflow that runs on pull
# requests; macOS and Windows Rust tests run only in the native package workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'COPYING'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'COPYING'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Unsafe census
        run: node scripts/check-unsafe-census.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Type-check and build the frontend
        run: npm run build
      - name: Find the runner's Chrome for the real-browser UI tests
        # test-frontend-surfaces.mjs and test-startup-navigation.mjs skip
        # without KIWIX_TEST_CHROME on a developer machine and fail without it
        # under CI. The wrapper passes --no-sandbox: Ubuntu 24.04 restricts the
        # unprivileged user namespaces Chromium's sandbox needs, and these
        # pages are this checkout's own frontend served from loopback, which
        # the same job already runs unsandboxed under Node.
        run: |
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$chrome" ]; then
            printf '%s\n' 'No Chrome or Chromium executable on this runner; the browser UI tests cannot run.' >&2
            exit 1
          fi
          "$chrome" --version
          wrapper="$RUNNER_TEMP/kiwix-test-chrome"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$wrapper"
          chmod +x "$wrapper"
          echo "KIWIX_TEST_CHROME=$wrapper" >> "$GITHUB_ENV"
      - name: JavaScript tests
        run: node --test scripts/test-*.mjs
      - name: Python script tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Linux package input handling test
        # The hyphenated file name is outside the test_*.py discovery pattern.
        run: python scripts/test-linux-appimage.py
      - name: Upload the embedded frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  connector:
    name: Agent connector tests and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --manifest-path kiwix-mcp/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path kiwix-mcp/Cargo.toml

  android-typecheck:
    # Check-only mode skips platform shims and intentionally prevents linking.
    # Type-checks cfg(mobile)/Android code that the desktop jobs never compile.
    name: Android clippy (${{ matrix.target }}, type-check only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            clang: aarch64-linux-android24-clang
            features: custom-protocol,android-evaluation
          - target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi24-clang
            features: custom-protocol
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Download the built frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Clippy with warnings as errors
        env:
          KIWIX_TYPECHECK_ONLY: '1'
        run: |
          : "${ANDROID_NDK_LATEST_HOME:?runner image provides no Android NDK}"
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          target_env=$(echo '${{ matrix.target }}' | tr '-' '_')
          export "CC_${target_env}=$toolchain/${{ matrix.clang }}"
          export "CXX_${target_env}=$toolchain/${{ matrix.clang }}++"
          export "AR_${target_env}=$toolchain/llvm-ar"
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml \
            --target ${{ matrix.target }} --lib --features ${{ matrix.features }} -- -D warnings

  windows-typecheck:
    # Type-checks cfg(windows) code on pull requests; the Windows package job
    # in build.yml runs only on manual dispatch. Releases target
    # x86_64-pc-windows-msvc, but the MinGW target compiles the same
    # cfg(windows) code without a Windows runner.
    name: Windows clippy (x86_64-pc-windows-gnu, type-check only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: Install the MinGW-w64 cross compiler for C/C++ build scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Download the built frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Clippy with warnings as errors
        env:
          KIWIX_TYPECHECK_ONLY: '1'
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml \
            --target x86_64-pc-windows-gnu --lib --tests --features custom-protocol -- -D warnings
      - name: Check the shared Windows security crate
        run: cargo clippy --locked --manifest-path win-security/Cargo.toml --target x86_64-pc-windows-gnu -- -D warnings
      - name: Check Windows agent connector and its tests
        run: cargo clippy --locked --manifest-path kiwix-mcp/Cargo.toml --target x86_64-pc-windows-gnu --all-targets -- -D warnings

  linux-typecheck:
    # The GTK/WebKit code is cfg(linux); type-check it on the runner that
    # provides the same system libraries as the Debian package/AppImage.
    name: Linux clippy (x86_64-unknown-linux-gnu, type-check only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install GTK/WebKit development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Clippy with warnings as errors
        env:
          KIWIX_TYPECHECK_ONLY: '1'
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/kiwix-mcp-x86_64-unknown-linux-gnu
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib --tests --features custom-protocol -- -D warnings

  linux-tests:
    # The same test command as the Linux job in build.yml, which runs only
    # after a push to main. As in the clippy job above, an empty sidecar
    # placeholder satisfies Tauri's resource resolution.
    name: Linux Rust unit tests (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: frontend
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK/WebKit development packages and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev xvfb
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Rust unit tests
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/kiwix-mcp-x86_64-unknown-linux-gnu
          xvfb-run --auto-servernum cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --features custom-protocol

  native-sanitizers:
    name: LocalSwarm ASan/UBSan (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and run the native bridge with ASan/UBSan
        run: ./scripts/test-native-sanitizers.sh
