[package]
name = "kiwix-mcp"
version = "0.1.0"
edition = "2021"
description = "Kiwix offline-library agent connector: an MCP stdio relay to the running Kiwix app"
license = "GPL-3.0-or-later"
publish = false

# A separate crate on purpose: the relay must not link libzim, WebView or the
# Tauri resources that the app's build script adds to every target in its package.

[dependencies]
serde_json = "1"
chksum-hash-sha2-256 = "=0.0.1"
same-file = "1"
directories = "6"

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.32.0", default-features = false, features = ["socket", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "net", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
win-security = { path = "../win-security" }

[patch.crates-io]
itoa = { path = "../src-tauri/vendor/itoa-1.0.19" }
memchr = { path = "../src-tauri/vendor/memchr-2.8.3" }
serde_json = { path = "../src-tauri/vendor/serde_json-1.0.154" }
zmij = { path = "../src-tauri/vendor/zmij-1.0.23" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
