[package]
name = "kiwix-mcp"
version = "0.1.0"
edition = "2021"
description = "Kiwix offline-library agent connector: an MCP stdio relay to the running Kiwix app"
license = "GPL-3.0-or-later"
publish = false

# A separate crate on purpose: the relay must not link libzim, WebView or the
# Tauri resources that the app's build script adds to every target in its package.

[dependencies]
serde_json = "1"
sha2 = "0.10"
same-file = "1"
directories = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
